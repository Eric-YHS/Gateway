name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # .NET Framework 4.7.2 只能在 Windows Runner 上编译；这是本仓库最有效的门禁：
  # 网关的站点归属、路径规则、授权逻辑都靠编译器保证不出现签名/引用错误。
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release)
        run: msbuild GatewayDemo.Legacy.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /nologo /v:minimal

      # bin/ 已从版本库移除（编译产物），改为按需下载构件，避免把 DLL 当源码维护。
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: gateway-legacy-release
          path: |
            src/GatewayDemo.Legacy.Core/bin/
            src/GatewayDemo.Legacy.Web/bin/
            src/MockBusinessBackend.Legacy.Web/bin/
          if-no-files-found: warn
          retention-days: 14

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 部署脚本是现场唯一的部署入口，语法错误必须在到客户机器之前暴露。
      - name: Parse deployment PowerShell scripts
        shell: pwsh
        run: |
          $fail = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $fail = $true
              Write-Host "::error file=$($_.Path)::[$($_.Name)] 解析失败"
              $errors | ForEach-Object { Write-Host ("  line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            } else {
              Write-Host "ok $($_.Name)"
            }
          }
          if ($fail) { exit 1 }

      # gateway-sites.json 支持热更新，写坏会让所有站点同时不可用。
      - name: Validate site manifest JSON
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter gateway-sites.json | ForEach-Object {
            $null = Get-Content $_.FullName -Raw | ConvertFrom-Json
            Write-Host "ok $($_.Name)"
          }

      - name: Fail on leftover build outputs in git
        run: |
          bad=$(git ls-files -- '*/bin/*' '*/obj/*' '*.user' '*.suo')
          if [ -n "$bad" ]; then
            echo "编译产物不应入库，请 git rm --cached："
            echo "$bad"
            exit 1
          fi
          echo "ok: 无编译产物入库"

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
