<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>统一认证访问网关 - 请求未能处理</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#eef4f7;color:#12202b;}
.shell{max-width:720px;margin:0 auto;padding:24px;}
.card{background:#fff;border-radius:18px;padding:22px;margin:0 0 18px;box-shadow:0 16px 38px rgba(18,32,43,.07);}
h1{margin-top:0;}
.notice{padding:13px 14px;border-radius:14px;margin:14px 0 0;background:#fee3e3;}
</style>
</head>
<body>
<div class="shell">
<section class="card">
<h1>请求未能处理</h1>
<div class="notice"><span>抱歉，服务器无法处理该请求。请检查访问地址是否正确，或稍后重试；如果问题持续出现，请联系管理员。</span></div>
</section>
</div>
</body>
</html>
