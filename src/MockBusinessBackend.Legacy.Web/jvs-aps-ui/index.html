<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企业应用门户</title>
    <link rel="icon" href="data:," />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif; margin: 0; padding: 1rem; background: #f8fafc; color: #172033; }
        .shell { max-width: 960px; margin: 0 auto; }
        header { background: #0f766e; color: #fff; padding: 1rem; margin: -1rem -1rem 1.5rem -1rem; }
        header h1 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
        nav { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        nav a { color: rgba(255,255,255,0.92); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: 4px; }
        nav a:hover { background: rgba(255,255,255,0.15); }
        .card { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(15,23,42,0.12); margin-bottom: 1rem; }
        .meta { color: #64748b; font-size: 0.9rem; }
        @media (max-width: 640px) {
            body { padding: 0.5rem; }
            header { padding: 0.75rem; margin: -0.5rem -0.5rem 1rem -0.5rem; }
            header h1 { font-size: 1.1rem; }
            nav { gap: 0.25rem; }
            nav a { font-size: 0.875rem; padding: 0.25rem 0.5rem; }
            .card { padding: 1rem; }
        }
        @media (min-width: 1200px) {
            .shell { max-width: 1100px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <h1>企业应用门户</h1>
            <nav>
                <a data-link data-route="/" href="./index.html">首页</a>
                <a data-link data-route="/orders" href="./orders">订单</a>
                <a data-link data-route="/reports/2026" href="./reports/2026">报表</a>
            </nav>
        </header>
        <div class="card" id="view">
            <h2>首页</h2>
        </div>
    </div>
    <script>
        (function () {
            function detectBasePath() {
                var path = window.location.pathname || "/";
                var marker = "/jvs-aps-ui/";
                var markerIndex = path.toLowerCase().indexOf(marker);
                if (markerIndex >= 0) return path.substring(0, markerIndex + marker.length);
                if (path.toLowerCase() === "/jvs-aps-ui") return "/jvs-aps-ui/";
                var idx = path.lastIndexOf("/");
                return idx >= 0 ? path.substring(0, idx + 1) : "/";
            }
            var BASE = detectBasePath();

            function normalizeRoute(path) {
                if (BASE !== "/" && path.toLowerCase().indexOf(BASE.toLowerCase()) === 0) {
                    path = path.substring(BASE.length) || "/";
                } else if (path.toLowerCase().indexOf("/jvs-aps-ui") === 0) {
                    path = path.substring("/jvs-aps-ui".length) || "/";
                }
                if (path.charAt(0) !== "/") path = "/" + path;
                return path === "/index.html" ? "/" : path;
            }

            function render() {
                var path = normalizeRoute(window.location.pathname || "/");
                var title = "首页";
                var body = "工作台";
                if (path.indexOf("/orders") === 0) {
                    title = "订单";
                    body = "订单管理";
                } else if (path.indexOf("/reports") === 0) {
                    title = "报表";
                    body = "数据报表";
                }

                document.getElementById("view").innerHTML =
                    "<h2>" + title + "</h2><p>" + body + "</p>";
                document.title = title + " - 企业应用门户";

                var apiBase = BASE.replace(/\/+$/, "") || "";
                fetch(apiBase + "/api/spa/ping?route=" + encodeURIComponent(path), { cache: "no-store" })
                    .catch(function () { });
            }

            document.addEventListener("click", function (event) {
                var link = event.target.closest ? event.target.closest("a[data-link]") : null;
                if (!link) return;
                event.preventDefault();
                var route = link.getAttribute("data-route");
                if (route) {
                    history.pushState(null, "", BASE.replace(/\/+$/, "") + route);
                } else {
                    var href = link.getAttribute("href");
                    var resolved = new URL(href, window.location.href);
                    history.pushState(null, "", resolved.pathname + resolved.search + resolved.hash);
                }
                render();
            });

            window.addEventListener("popstate", render);
            render();
        })();
    </script>
</body>
</html>
